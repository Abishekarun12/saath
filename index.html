<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Mukta:wght@400;500;700&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-width app shell, calm misty surfaces, marigold for "reach out" actions, teal for calm. Night Mode is its own deep-indigo world. */
:root{
  --bg:#EAF0EE; --surface:#FFFFFF; --ink:#1B2A31; --muted:#5A6B71; --line:#D3DDDA;
  --accent:#D98A1F; --accent-ink:#FFFFFF; --accent-soft:#FBEBD2;
  --calm:#2C6A6F; --calm-soft:#DCEBEA; --danger:#B3402F; --danger-soft:#F7E1DC;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Mukta","Noto Sans Malayalam","Noto Sans Tamil","Noto Naskh Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F191E; --surface:#16242A; --ink:#E4EDEB; --muted:#93A5A8; --line:#25363C;
    --accent:#EFAA45; --accent-ink:#1E1404; --accent-soft:#3A2C16;
    --calm:#73B5B7; --calm-soft:#1C3236; --danger:#E77B69; --danger-soft:#3A201B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F191E; --surface:#16242A; --ink:#E4EDEB; --muted:#93A5A8; --line:#25363C;
  --accent:#EFAA45; --accent-ink:#1E1404; --accent-soft:#3A2C16;
  --calm:#73B5B7; --calm-soft:#1C3236; --danger:#E77B69; --danger-soft:#3A201B;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--calm)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 6px}
.brand{font-family:var(--display);font-weight:650;font-size:26px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.sos{border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;cursor:pointer}
main{flex:1;padding:8px 18px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:650;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:28px} h2{font-size:21px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.accent{background:var(--accent-soft);border-color:transparent}
.card.calm{background:var(--calm-soft);border-color:transparent}
.card.danger{background:var(--danger-soft);border-color:var(--danger)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:500;cursor:pointer;background:var(--calm);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:44px}
:root[data-theme="dark"] .btn, .btn{color:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--calm);border-color:var(--calm);color:var(--surface)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;background:var(--calm-soft);color:var(--calm)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
label{font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=tel],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{resize:vertical;min-height:90px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile b{font-family:var(--display);font-weight:650;font-size:17px}
.tile span{font-size:14px;color:var(--muted);line-height:1.35}
.tile .ic{width:28px;height:28px;color:var(--calm)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.mood i{font-style:normal;font-size:22px}
.mood[aria-pressed="true"]{border-color:var(--calm);background:var(--calm-soft)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:12px;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a[aria-current="page"]{color:var(--calm);font-weight:700}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--calm);color:var(--surface);border-bottom-right-radius:6px;align-self:flex-end}
.msg.tip{background:var(--accent-soft);align-self:stretch;max-width:100%;font-size:15px}
.composer{position:sticky;bottom:78px;background:var(--bg);padding-top:6px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:140px;flex:1}
.iconbtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn.on{background:var(--danger);border-color:var(--danger);color:#fff}
.iconbtn.send{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.typing{color:var(--muted);font-size:15px}
.list{display:flex;flex-direction:column;gap:10px}
.person{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--calm-soft);color:var(--calm);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:650;font-size:18px}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--calm)}
.meter i.warn{background:var(--accent)} .meter i.bad{background:var(--danger)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars b{display:block;width:100%;background:var(--calm);border-radius:6px 6px 0 0;min-height:2px}
.bars b.hi{background:var(--accent)}
.bars span{font-size:12px;color:var(--muted)}
.stat{display:flex;flex-direction:column}
.stat strong{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.post{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.post:first-child{border-top:0;padding-top:0}
.sheet-wrap{position:fixed;inset:0;background:rgba(10,18,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:15px;max-width:90%}
.hl{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hl:first-of-type{border-top:0}
.hl strong{font-variant-numeric:tabular-nums;font-size:19px;white-space:nowrap}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
/* Night world */
.night{position:fixed;inset:0;z-index:20;overflow:auto;color:#E8E6FF;
  background:radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 12%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 30%,#fff5,transparent),radial-gradient(1px 1px at 85% 40%,#fff7,transparent),radial-gradient(1px 1px at 25% 60%,#fff4,transparent),linear-gradient(180deg,#070B1E 0%,#11163A 60%,#1C1A45 100%);
  color-scheme:dark}
.night .inner{max-width:520px;margin:0 auto;padding:18px 18px 60px;display:flex;flex-direction:column;gap:18px}
.night h1,.night h2{color:#F3EEFF}
.night .card{background:#ffffff0d;border-color:#ffffff1f}
.night textarea{background:#ffffff0f;border-color:#ffffff26;color:#F3EEFF}
.night .muted{color:#A9A6D6}
.night .chip{background:transparent;border-color:#ffffff33;color:#E8E6FF}
.night .chip[aria-pressed="true"]{background:#8C86E8;border-color:#8C86E8;color:#0B0F27}
.night .btn{background:#8C86E8;color:#0B0F27}
.night .btn.ghost{background:transparent;color:#E8E6FF;border-color:#ffffff33}
.breath{width:200px;height:200px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,#B9B3FF55,#8C86E822 60%,transparent 70%);display:flex;align-items:center;justify-content:center;transition:transform 4s ease-in-out;font-size:20px;color:#F3EEFF}
.story{white-space:pre-wrap;font-size:19px;line-height:1.7;font-family:var(--display);font-weight:500}
@media (prefers-reduced-motion: reduce){.breath{transition:none}}
@media (max-width:380px){.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a href="#home" class="brand" style="color:inherit;text-decoration:none" aria-label="Saath home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="8" fill="none" stroke="var(--calm)" stroke-width="2.4"/><circle cx="20" cy="16" r="8" fill="none" stroke="var(--accent)" stroke-width="2.4"/></svg>
      Saath
    </a>
    <button class="sos" data-act="help" type="button">Need help now</button>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" aria-label="Main">
    <div class="in" id="tabs"></div>
  </nav>
</div>
<div id="layer"></div>

<script>
/* ============ Small helpers ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const DAY = 86400000;
const now = () => Date.now();
function toast(t, ms=2600){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), ms); }
function daysAgo(ts){ if(!ts) return null; return Math.floor((now()-ts)/DAY); }
function ago(ts){ const d=daysAgo(ts); if(d===null) return "never"; if(d===0) return "today"; if(d===1) return "yesterday"; return d+" days ago"; }

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  talk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.1 4.4 1.8 5 4.9"/></svg>',
  night:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>',
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4h4M12 4v3"/><circle cx="12" cy="14" r="7"/><path d="M12 11v3l2 2"/></svg>',
  reach:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h11M11 7l5 5-5 5"/><circle cx="19" cy="12" r="1.6"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  groups:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="6" r="2.4"/><circle cx="5.5" cy="16" r="2.4"/><circle cx="18.5" cy="16" r="2.4"/><path d="M9.5 8.5l-2.5 5M14.5 8.5l2.5 5M8 17h8"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16M7 16v-5M12 16V7M17 16v-8"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>'
};

/* ============ Reference data ============ */
const LANGS = {
  English:"English", Hinglish:"Hinglish (Hindi and English mixed, written in Latin letters, the way people text in India)",
  Hindi:"Hindi in Devanagari script", Malayalam:"Malayalam in Malayalam script", Tamil:"Tamil in Tamil script",
  Arabic:"simple, warm Arabic that Gulf speakers understand", Urdu:"Urdu in Urdu script"
};
const ZONES = [["Asia/Kolkata","India"],["Asia/Dubai","UAE"],["Asia/Karachi","Pakistan"],["Asia/Dhaka","Bangladesh"],["Asia/Colombo","Sri Lanka"],["Asia/Kathmandu","Nepal"],["Asia/Manila","Philippines"],["Asia/Riyadh","Saudi Arabia"],["Asia/Qatar","Qatar"],["Asia/Singapore","Singapore"],["Europe/London","UK"],["America/New_York","USA (East)"],["America/Toronto","Canada (Toronto)"],["Australia/Sydney","Australia (Sydney)"]];
const HOMES = {"Dubai":"Asia/Dubai","Abu Dhabi":"Asia/Dubai","Other UAE":"Asia/Dubai","India":"Asia/Kolkata","Somewhere else":Intl.DateTimeFormat().resolvedOptions().timeZone||"Asia/Dubai"};
const HELP = {
  uae:[
    ["National Hope line (call or WhatsApp, Arabic & English)","800 4673","tel:8004673"],
    ["Dubai Itma'en support (9am to midnight)","800 506","tel:800506"],
    ["Abu Dhabi Sakina line (24/7)","800 725462","tel:800725462"],
    ["Emergency: police / ambulance","999 / 998","tel:999"]
  ],
  india:[
    ["Tele-MANAS mental health line (24/7, many languages)","14416","tel:14416"],
    ["Tele-MANAS toll-free","1-800-891-4416","tel:18008914416"],
    ["Emergency","112","tel:112"]
  ]
};
const GROUPS = [
  ["home","Missing home","For anyone far from family: expats, hostel students, new jobs in a new city."],
  ["pressure","Exams & career pressure","Results, placements, layoffs, the weight of everyone's expectations."],
  ["family","Marriage & family pressure","Rishta talk, comparisons, and \"log kya kahenge\"."],
  ["newcity","New in Dubai","Just moved and still finding your people."],
  ["night","Night thinkers","Awake at 2am with a busy mind."]
];
const MOODS = [["😣","Heavy"],["😔","Low"],["😐","Okay"],["🙂","Calm"],["😊","Good"]];
const CRISIS_RE = /(suicid|kill myself|end my life|end it all|want to die|wanna die|don'?t want to live|no reason to live|self[- ]?harm|cut myself|hurt myself|marna chah|mar jaana|mar jana|khudkushi|jeena nahi|aatmahatya|आत्महत्या|मरना चाह|ആത്മഹത്യ|தற்கொலை|انتحار|خودکشی)/i;

/* ============ State ============ */
const S = {
  profile:{ name:"", lang:"English", home:"Dubai", voice:false, onboarded:false },
  people:[], chat:[], memory:[], checkins:[], reachouts:[], unsaid:[], dumps:[], groupPosts:[], metoo:[]
};
const KEYS = Object.keys(S);
const UI = { busy:false, analysis:null, crisis:false, mode:{type:"companion"}, draftReach:null, check:null, nightTab:"dump", story:"", nightReply:"", groupKey:"home", groupDocs:[], groupsSub:null, groupsLoading:false, groupsNote:"" };
const caps = { sample:null, db:null, user:null, dictation:null, tts:null, ready:false };

/* ============ Storage: private per-person cloud data, device fallback ============ */
const Store = {
  mode:"memory", uid:null, writing:{}, again:{}, timers:{}, readonly:false,
  async init(){
    if(caps.db && caps.user){
      try{
        const id = await caps.user.id();
        if(id){
          this.uid = id;
          const snap = await Promise.race([
            caps.db.collection("data/users/"+id).get(),
            new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))
          ]);
          snap.docs.forEach(d=>{ const v=d.data(); if(v && KEYS.includes(d.id) && "v" in v) S[d.id]=v.v; });
          this.mode="cloud"; return;
        }
      }catch(e){ /* fall through to device storage */ }
    }
    try{ const raw=localStorage.getItem("saath:v1"); if(raw){ const o=JSON.parse(raw); KEYS.forEach(k=>{ if(k in o) S[k]=o[k]; }); } this.mode="device"; }
    catch(e){ this.mode="memory"; }
  },
  save(key){
    if(this.mode==="cloud"){ if(this.readonly) return; clearTimeout(this.timers[key]); this.timers[key]=setTimeout(()=>this.write(key),500); }
    else if(this.mode==="device"){ try{ const o={}; KEYS.forEach(k=>o[k]=S[k]); localStorage.setItem("saath:v1",JSON.stringify(o)); }catch(e){} }
  },
  async write(key){
    if(this.writing[key]){ this.again[key]=true; return; }
    this.writing[key]=true;
    try{ await caps.db.collection("data/users/"+this.uid).doc(key).set({v:S[key]}); }
    catch(e){
      if(e && e.code==="invalid_argument"){ this.readonly=true; toast("Your changes can't be saved. Ask the person who shared Saath to give you Contributor access.",5000); }
      else if(e && e.code==="quota_exceeded"){ toast("Storage is full. Clear old chats in Settings."); }
    }
    this.writing[key]=false;
    if(this.again[key]){ this.again[key]=false; this.write(key); }
  },
  async wipe(){
    KEYS.forEach(k=>{ S[k]=Array.isArray(S[k])?[]:S[k]; });
    S.profile={ name:"", lang:"English", home:"Dubai", voice:false, onboarded:false };

function region(){ return (S.profile.home==="India") ? "india" : "uae"; }
function helplineText(){ const r=region(); const a=HELP[r].map(h=>h[0]+": "+h[1]); return a.join("; "); }

function peopleLine(){ return S.people.length ? S.people.map(p=>p.name+(p.rel?" ("+p.rel+")":"")+(p.last?", last contact "+ago(p.last):"")).join("; ") : "none added yet"; }

function companionPrompt(){
  const name = S.profile.name || "the person";
  if(UI.mode.type==="rehearse"){
    return `You are helping ${name} rehearse saying something hard to ${UI.mode.who}. What they want to say: "${UI.mode.text}".
Play ${UI.mode.who} realistically but kindly, in short replies (1-3 sentences), the way a real ${UI.mode.who} might react in an Indian or Gulf family/friendship context.
After your in-character reply, add a new line that starts with "Tip:" and give one short, encouraging coaching tip about how ${name} phrased it.
If ${name} says "stop" or "done", step out of character, praise their courage, and suggest they try saying it for real when ready.
${langLine()}`;
  }
  return `You are Saath, a warm companion inside a wellbeing app for people who overthink and feel lonely. Most users live in India or the UAE; many are South Asian expats far from family.
About the person: name ${S.profile.name||"unknown"}; lives in ${S.profile.home}. ${langLine()}
People they care about: ${peopleLine()}.
What you remember from earlier chats: ${S.memory.length?S.memory.slice(-6).join(" | "):"nothing yet"}.
How to talk:
- Short replies: 2 to 4 sentences, like a caring friend texting. No lists or headings.
- First reflect what you heard in your own words. Ask at most one gentle question.
- When they are stuck in a loop, gently move from "why" to "what now", and help separate what actually happened from what they are assuming.
- Understand the context: family pressure, "log kya kahenge", visa and job worries, missing home, exams, marriage pressure, time-zone distance from family.
- Your purpose is to help them feel less alone AND to reconnect them with real people. When they mention someone they miss or trust, gently suggest reaching out; the app has a Reach Out button that helps write the message. Never present yourself as a replacement for people, and never encourage them to rely only on you.
- You are not a therapist or doctor. Do not diagnose. If heaviness has lasted weeks, encourage talking to a counsellor.
- If they mention suicide, self-harm, or being in danger: respond with care, say they deserve support right now, urge them to contact a helpline or emergency services (${helplineText()}) or someone they trust, and stay with them.
- Never shame or lecture.`;
}
function buildMessages(history, instructions){
  const msgs=[]; let started=false;
  history.forEach(m=>{
    if(!started){ if(m.role!=="user") return; started=true; msgs.push({role:"user",content:instructions+"\n\n---\nThe conversation begins. The person says:\n"+m.content}); return; }
    const last=msgs[msgs.length-1];
    if(last && last.role===m.role){ last.content+="\n"+m.content; } else msgs.push({role:m.role,content:m.content});
  });
  return msgs;
}
function aiErrorText(e){
  if(!e) return "Something went wrong. Try again in a moment.";
  if(e.code==="not_granted") return "AI replies are switched off for you. Allow Saath to use Claude when asked, then try again.";
  if(e.code==="rate_limited") return "Lots of messages at once. Wait a minute, then try again.";
  return "I couldn't reply just now. Try again in a moment.";
}

/* ============ Dictation (voice typing) ============ */
const Dict = { target:null, base:"", finals:"", on:false, wired:false };
function wireDictation(){
  const d=caps.dictation; if(!d||Dict.wired) return; Dict.wired=true;
  d.onPartial(({text})=>{ const el=Dict.target&&document.getElementById(Dict.target); if(el) el.value=(Dict.base+" "+Dict.finals+" "+text).replace(/\s+/g," ").trim(); });
  d.onFinal(({text})=>{ Dict.finals+=" "+text; const el=Dict.target&&document.getElementById(Dict.target); if(el) el.value=(Dict.base+" "+Dict.finals).replace(/\s+/g," ").trim(); });
  d.onState(({state})=>{ Dict.on = state==="listening"; document.querySelectorAll("[data-act=mic]").forEach(b=>{ b.classList.toggle("on",Dict.on && b.dataset.target===Dict.target); b.setAttribute("aria-pressed",String(Dict.on && b.dataset.target===Dict.target)); }); });
}
function micButton(target){ return caps.dictation ? `<button class="iconbtn" type="button" data-act="mic" data-target="${target}" aria-label="Speak instead of typing" aria-pressed="false">${ICON.mic}</button>` : ""; }
function toggleMic(btn){
  const d=caps.dictation; if(!d) return;
  if(Dict.on){ d.stop().catch(()=>{}); return; }
  Dict.target=btn.dataset.target; const el=document.getElementById(Dict.target);
  Dict.base=el?el.value:""; Dict.finals="";
  d.start().catch(e=>{ if(e&&e.code==="not_granted"){ toast("Microphone not allowed. You can keep typing."); } });
}
function speak(text){ if(caps.tts && S.profile.voice){ caps.tts.speak(String(text).slice(0,1900)).catch(()=>{}); } }

/* ============ Views ============ */
function greeting(){ const h=new Date().getHours(); return h<5?"Still awake":h<12?"Good morning":h<17?"Good afternoon":h<22?"Good evening":"It's late"; }
function localTime(tz){ try{ return new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit"}).format(new Date()); }catch(e){ return "--:--"; } }
function localHour(tz){ try{ const p=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"numeric",hour12:false}).formatToParts(new Date()).find(x=>x.type==="hour"); return Number(p.value)%24; }catch(e){ return 12; } }
function goodTime(tz){ const h=localHour(tz); return h>=9 && h<22; }
function zoneName(tz){ const z=ZONES.find(x=>x[0]===tz); return z?z[1]:tz; }
function overdue(p){ const d=daysAgo(p.last); return d===null?999:d-(p.every||7); }
function monthCount(arr, fn){ const start=new Date(); start.setDate(1); start.setHours(0,0,0,0); return arr.filter(x=>x.ts>=start.getTime() && (!fn||fn(x))).length; }

function vInsights(){

  const maxD=Math.max(1,...heavyByDay), maxS=Math.max(1,...heavyBySlot);

async function sendChat(text){
  text=text.trim(); if(!text||UI.busy) return;
  if(!caps.ready){ toast("Still connecting. Try again in a few seconds."); $("#chatIn").value=text; return; }
  if(CRISIS_RE.test(text)) UI.crisis=true;
  S.chat.push({role:"user",content:text,ts:now()}); trimChat(); save("chat");
  UI.analysis=null;
  if(noAI()){ S.chat.push({role:"assistant",content:NO_AI_TEXT,ts:now()}); save("chat"); render(); return; }
  UI.busy=true; render();
  const history=S.chat.filter(m=>m.mode===undefined || m.mode===UI.mode.type);
  const msgs=buildMessages(history.slice(-24), companionPrompt());
  const live={role:"assistant",content:"",ts:now()};
  try{
    const res=await caps.sample(msgs,{cache:false,onText:({text})=>{ live.content=text; const t=$("#typing"); if(t){ t.className="msg ai"; t.textContent=text; } }});
    live.content=(res&&res.text)||live.content||"…";
  }catch(e){ live.content=aiErrorText(e); live.err=true; }
  UI.busy=false; S.chat.push(live); trimChat(); save("chat"); render();
  if(!live.err){ speak(live.content.split(/\nTip:/)[0]); if(UI.mode.type==="companion") analyse(); }
}
function trimChat(){ if(S.chat.length>60) S.chat=S.chat.slice(-60); }
async function analyse(){
  if(noAI()) return;
  const recent=S.chat.slice(-6).map(m=>(m.role==="user"?"PERSON: ":"SAATH: ")+m.content).join("\n");
  try{
    const v=await caps.sample.json(`Read this chat from a wellbeing app. Return JSON only: {"risk":"none"|"concern"|"crisis","person":string|null}.
"risk" is "crisis" only if the PERSON mentions suicide, self-harm, or being in danger.
"person" is the name or relation (e.g. "Vishnu", "Amma", "my sister") of ONE real person the PERSON seems to miss, trust, or want to talk to, and only if reaching out would genuinely help right now; else null.
Their saved people: ${S.people.map(p=>p.name).join(", ")||"none"}.
CHAT:
${recent}`,{modelTier:"quick",cache:false});
    if(v && v.risk==="crisis") UI.crisis=true;
    if(v && v.person && !UI.dismissed?.includes(v.person)) UI.analysis={person:String(v.person).slice(0,40)};
    if(route()==="talk") render();
  }catch(e){}
}
async function summarise(){
  const conv=S.chat.filter(m=>!m.mode||m.mode==="companion");
  if(noAI()||conv.filter(m=>m.role==="user").length<2) return;
  const text=conv.slice(-20).map(m=>(m.role==="user"?"PERSON: ":"SAATH: ")+m.content).join("\n");
  try{
    const r=await caps.sample(`Summarise this conversation in at most 2 short sentences in English, as private notes for a companion to remember next time: the main worry, people mentioned, and what helped. No advice.\n\n${text}`,{modelTier:"quick",cache:false});
    if(r&&r.text){ S.memory.push(r.text.trim().slice(0,400)); if(S.memory.length>10) S.memory=S.memory.slice(-10); save("memory"); }
  }catch(e){}
}

Situation or chat:
"""${text}"""
Their worry: "${worry||"not stated"}"

{"said":[2-4 short neutral statements of only what was literally said or done],
"assuming":[1-3 assumptions their mind may be adding],

let breathTimer=null;
function stopBreath(){ clearTimeout(breathTimer); breathTimer=null; UI.breathing=false; }
function runBreath(){
  const el=()=>$("#breath"); let round=0;
  const steps=[["Breathe in",4,1.35],["Hold",7,1.35],["Breathe out",8,1]];
  const step=(i)=>{ if(!UI.breathing) return; if(i===0){ round++; if(round>4){ stopBreath(); if(el()){ el().textContent="Well done"; el().style.transform="scale(1)"; } openNight(); return; } }
    const [label,secs,scale]=steps[i]; const b=el(); if(b){ b.style.transitionDuration=secs+"s"; b.style.transform=`scale(${scale})`; b.textContent=label+" · "+secs; }
    breathTimer=setTimeout(()=>step((i+1)%3),secs*1000); };
  step(0);
}

  UI.groupsLoading=true;
  const t=setTimeout(()=>{ UI.groupsNote="The circle is taking a while to load. It may be out of date."; UI.groupsLoading=false; if(route()==="groups") render(); },10000);
  UI.groupsSub=caps.db.collection("circle_posts").onSnapshot(snap=>{
    UI.groupDocs=snap.docs.map(d=>({id:d.id,...(d.data()||{})}));
    if(!snap.metadata.fromCache){ clearTimeout(t); UI.groupsNote=""; }
    UI.groupsLoading=false; if(route()==="groups") render();
  }, err=>{ clearTimeout(t); UI.groupsLoading=false; UI.groupsNote="Circles can't be loaded right now."; if(route()==="groups") render(); });
}
let groupWriting=false;
async function writeGroupDoc(){
  if(!caps.db||!Store.uid) return; if(groupWriting){ setTimeout(writeGroupDoc,600); return; }
  groupWriting=true;
  try{ await caps.db.doc("circle_posts/"+Store.uid).set({posts:S.groupPosts.slice(-40),metoo:S.metoo.slice(-300)}); }
  catch(e){ if(e&&e.code==="invalid_argument") toast("You can read circles but not post. Ask whoever shared Saath for Contributor access.",5000); }
  groupWriting=false;
}
async function postToGroup(text){
  text=text.trim(); if(!text) return;
  if(text.length>600){ toast("Keep it under 600 characters."); return; }
  if(CRISIS_RE.test(text)){ helpSheet(); return; }
  UI.busy=true; render();
  let ok=true, why="";
  if(!noAI()){
    try{ const v=await caps.sample.json(`Moderate a post for an anonymous peer-support circle about loneliness and overthinking. Return JSON only: {"allow":boolean,"risk":"none"|"crisis","reason":"short, kind reason if not allowed"}.
Block: phone numbers, emails, full names or exact addresses, hate, harassment, sexual content, ads, encouraging self-harm. Allow honest sadness and venting. "risk" is "crisis" if the writer mentions suicide or self-harm.
POST: """${text}"""`,{modelTier:"quick",cache:false});
      if(v){ ok=!!v.allow; why=v.reason||""; if(v.risk==="crisis"){ UI.busy=false; render(); helpSheet(); return; } } }
    catch(e){ /* allow if moderation unavailable, but basic filter below */ }
  }
  if(/\+?\d[\d\s-]{7,}\d|@[\w.-]+\.\w+/.test(text)){ ok=false; why="Please remove phone numbers or emails to keep everyone safe."; }
  UI.busy=false;
  if(!ok){ toast(why||"This post can't be shared. Try rewording it.",4500); render(); return; }
  S.groupPosts.push({id:uid(),g:UI.groupKey,text,ts:now()}); save("groupPosts"); await writeGroupDoc(); render();
}

/* ============ Events ============ */
document.addEventListener("click", async (e)=>{
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==="closeSheetBg"){ if(e.target===b) closeSheet(); return; }
  switch(a){
    case "help": helpSheet(); break;
    case "closeSheet": closeSheet(); break;
    case "mic": toggleMic(b); break;
    case "mood": { const v=Number(b.dataset.v); const last=S.checkins[S.checkins.length-1]; if(last&&now()-last.ts<30*60000){ last.mood=v; last.ts=now(); } else S.checkins.push({ts:now(),mood:v,lonely:false}); if(S.checkins.length>500) S.checkins=S.checkins.slice(-500); save("checkins"); render(); break; }
    case "lonely": { const last=S.checkins[S.checkins.length-1]; if(last){ last.lonely=!last.lonely; save("checkins"); render(); } break; }
    case "follow": { const r=S.reachouts.find(x=>x.id===id); if(r){ if(b.dataset.v==="unsent"){ S.reachouts=S.reachouts.filter(x=>x.id!==id); } else r.status=b.dataset.v; if(b.dataset.v==="noreply") r.ts=now(); save("reachouts"); toast(b.dataset.v==="replied"?"That's lovely. Real conversations matter most.":b.dataset.v==="noreply"?"People are busy. A late reply isn't a no.":"That's okay. It'll be here when you're ready."); render(); } break; }
    case "dumpSeen": { const d=S.dumps.find(x=>String(x.ts)===b.dataset.ts); if(d){ d.seen=true; save("dumps"); render(); } break; }
    case "dumpTalk": { const d=S.dumps.find(x=>String(x.ts)===b.dataset.ts); if(d){ d.seen=true; save("dumps"); UI.mode={type:"companion"}; go("talk"); setTimeout(()=>sendChat("Last night I wrote this before sleeping: \""+d.text+"\". Can we look at it now?"),50); } break; }
    case "reachPerson": { const p=personById(id); UI.draftReach={personId:id,name:p?p.name:""}; closeSheet(); go("reach"); break; }
    case "reachName": { const n=b.dataset.name||""; const p=S.people.find(x=>x.name.toLowerCase()===n.toLowerCase()); UI.draftReach=p?{personId:p.id,name:p.name}:{name:n}; UI.analysis=null; closeSheet(); go("reach"); break; }
    case "dismissNudge": UI.dismissed=[...(UI.dismissed||[]),UI.analysis&&UI.analysis.person]; UI.analysis=null; render(); break;
    case "talked": { const p=personById(id); if(p){ p.last=now(); save("people"); toast("Logged. "+p.name+" is lucky to have you."); render(); } break; }
    case "okAsk": { const p=personById(id); if(p){ p.okAsked=now(); save("people"); setTimeout(render,300); } break; }
    case "addPerson": personSheet(); break;
    case "editPerson": personSheet(personById(id)); break;
    case "delPerson": S.people=S.people.filter(p=>p.id!==id); save("people"); closeSheet(); render(); break;
    case "voice": S.profile.voice=!S.profile.voice; save("profile"); render(); break;
    case "newChat": await summarise(); S.chat=[]; UI.analysis=null; UI.crisis=false; save("chat"); render(); toast("Started fresh. Saath still remembers the gist."); break;
    case "endRehearse": UI.mode={type:"companion"}; S.chat=S.chat.filter(m=>m.mode!=="rehearse"); save("chat"); render(); break;
    case "intent": { UI.draftReach=UI.draftReach||{}; UI.draftReach.intent=b.dataset.v; UI.draftReach.note=$("#rNote")?.value||""; const nm=$("#rName"); if(nm) UI.draftReach.name=nm.value; const sel=$("#rPerson"); if(sel) UI.draftReach.personId=sel.value; render(); break; }
    case "pickOpt": { const d=UI.draftReach; d.pick=Number(b.dataset.i); d.text=d.options[d.pick]; render(); break; }
    case "sent": logSent(); break;
    case "copyMsg": { const t=$("#rMsg").value; navigator.clipboard?.writeText(t).then(()=>{ toast("Copied. Paste it into any chat."); logSent(); }).catch(()=>toast("Couldn't copy. Select the text and copy it.")); break; }
    case "useDraft": { const c=UI.check; UI.draftReach={name:"",text:c.draft,options:[c.draft],pick:0,reassure:"Asking directly is kinder to yourself than guessing all night."}; go("reach"); break; }
    case "closeNight": closeNight(); break;
    case "nightTab": stopBreath(); UI.nightTab=b.dataset.v; UI.nightReply=""; openNight(); break;
    case "dump": nightDump(); break;
    case "breathe": if(UI.breathing){ stopBreath(); openNight(); } else { UI.breathing=true; openNight(); runBreath(); } break;
    case "storySet": UI.storySet=b.dataset.v; openNight(); break;
    case "story": nightStory(); break;
    case "readStory": caps.tts&&caps.tts.speak(UI.story.slice(0,1900),{rate:0.85,voice:"airy"}).catch(()=>{}); break;
    case "rehearse": { const u=S.unsaid.find(x=>x.id===id); if(u){ S.chat=S.chat.filter(m=>m.mode!=="rehearse"); UI.mode={type:"rehearse",who:u.who,text:u.text}; go("talk"); } break; }
    case "delUnsaid": S.unsaid=S.unsaid.filter(u=>u.id!==id); save("unsaid"); render(); break;
    case "delAllUnsaid": confirmSheet("Delete everything in your Unsaid box?","delAllUnsaid"); break;
    case "delAllUnsaidYes": S.unsaid=[]; save("unsaid"); closeSheet(); render(); break;
    case "group": UI.groupKey=b.dataset.v; render(); break;
    case "metoo": { const k=b.dataset.k; S.metoo=S.metoo.includes(k)?S.metoo.filter(x=>x!==k):[...S.metoo,k]; save("metoo"); render(); writeGroupDoc(); break; }
    case "delPost": S.groupPosts=S.groupPosts.filter(p=>p.id!==id); save("groupPosts"); await writeGroupDoc(); render(); break;
    case "clearChat": confirmSheet("Clear your chat history?","clearChat"); break;
    case "clearChatYes": S.chat=[]; S.memory=[]; save("chat","memory"); closeSheet(); render(); break;
    case "wipe": confirmSheet("Delete all your Saath data?","wipe"); break;
    case "wipeYes": await Store.wipe(); closeSheet(); toast("All your data is deleted."); go("home"); break;
  }
});
document.addEventListener("submit", (e)=>{
  const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  if(Dict.on && caps.dictation) caps.dictation.stop().catch(()=>{});
  switch(f.dataset.form){
    case "chat": { const t=$("#chatIn").value; $("#chatIn").value=""; if(UI.mode.type==="rehearse"){ sendRehearse(t); } else sendChat(t); break; }
    case "check": runCheck($("#chkIn").value,$("#chkWorry").value); break;
    case "reach": draftReach(); break;
    case "unsaid": { const t=$("#unIn").value.trim(); if(!t) return; S.unsaid.push({id:uid(),text:t,who:$("#unWho").value.trim(),ts:now()}); save("unsaid"); if(CRISIS_RE.test(t)) helpSheet(); render(); toast("Kept safe."); break; }
    case "post": postToGroup($("#postIn").value); break;
    case "prefs": { S.profile.name=$("#pName").value.trim(); S.profile.lang=$("#pLang").value; S.profile.home=$("#pHome").value; const v=$("#pVoice"); if(v) S.profile.voice=v.checked; save("profile"); toast("Saved."); render(); break; }
    case "onboard": { S.profile.name=$("#oName").value.trim(); S.profile.lang=$("#oLang").value; S.profile.home=$("#oHome").value; S.profile.onboarded=true; save("profile"); closeSheet(); render(); break; }
    case "person": {
      const pid=f.dataset.id; const data={name:$("#psName").value.trim(),rel:$("#psRel").value.trim(),phone:$("#psPhone").value.trim(),tz:$("#psTz").value,every:Math.max(1,Math.min(90,Number($("#psEvery").value)||7))};
      if(!data.name) return;
      if(pid){ Object.assign(personById(pid),data); } else S.people.push({id:uid(),last:null,...data});
      save("people"); closeSheet(); render(); break;
    }
  }
});
document.addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && !e.shiftKey && e.target.id==="chatIn"){ e.preventDefault(); e.target.form.requestSubmit(); }
  if(e.key==="Escape" && UI.sheet) closeSheet();
});
function sendRehearse(t){
  t=t.trim(); if(!t) return;
  S.chat.push({role:"user",content:t,ts:now(),mode:"rehearse"});
  if(noAI()){ S.chat.push({role:"assistant",content:NO_AI_TEXT,ts:now(),mode:"rehearse"}); render(); return; }
  UI.busy=true; render();
  const msgs=buildMessages(S.chat.filter(m=>m.mode==="rehearse").slice(-20), companionPrompt());
  const live={role:"assistant",content:"",ts:now(),mode:"rehearse"};
  caps.sample(msgs,{cache:false,onText:({text})=>{ live.content=text; const tEl=$("#typing"); if(tEl){ tEl.className="msg ai"; tEl.textContent=text; } }})
    .then(r=>{ live.content=r.text||live.content; }).catch(e=>{ live.content=aiErrorText(e); })
    .finally(()=>{ UI.busy=false; S.chat.push(live); save("chat"); render(); speak(live.content.split(/\nTip:/)[0]); });
}

/* ============ Boot ============ */
render();
(async function boot(){
  const use = n => (window.claude && typeof window.claude.use==="function") ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [sample, db, user, dictation, tts] = await Promise.all(["sample","db","user","dictation","tts"].map(use));
  Object.assign(caps,{sample,db,user,dictation,tts});
  wireDictation();
  await Store.init();
  caps.ready=true;
  render();
})();
</script>
